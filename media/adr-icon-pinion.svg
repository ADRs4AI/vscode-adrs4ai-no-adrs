  <title id="title">Pinion pictogram — dark side down — amber default, tintable</title>
  <desc id="desc">Document grown for breathing room around the untouched scale; stroke at ~87% of bold; default color is the project amber (#D97706) via the root color attribute — any external CSS color overrides it (Peacock-tintable), and it can never render invisible-black.</desc>

