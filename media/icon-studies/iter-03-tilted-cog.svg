<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Study 3: tilted beam + small toothed cog at the pivot, borrowing
       Caliper's "craft law №1" convention from ios-icon-caliper-5.md's
       [SCALES_PINION] tag ("the pivot rendered as a SMALL COG... the axis
       the whole deliberation turns on") — testing whether that detail
       still reads at 128px on our own glyph, not just theirs. -->
