<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Study 3: tilted beam + small toothed cog at the pivot, borrowing
       Caliper's "craft law №1" convention from ios-icon-caliper-5.md's
       [SCALES_PINION] tag ("the pivot rendered as a SMALL COG... the axis
       the whole deliberation turns on") — testing whether that detail
       still reads at 128px on our own glyph, not just theirs.
       Revised 2026-08-14: teeth redrawn as short blunt tabs (not thin
       rays) after checking brand-studio's scale_cog_reference_library —
       Tabler's outline `settings` cog (same stroke/round-cap paradigm as
       this icon) reads as a gear; thin rays read as a compass/asterisk. -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#FFFFFF"/>
  <g fill="none" stroke="#B45309" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 24v72" stroke-width="5"/>
    <path d="M46 96h36" stroke-width="5"/>
    <path d="M20 52L108 24" stroke-width="5"/>
    <path d="M20 52v22" stroke-width="3"/>
    <path d="M108 24v22" stroke-width="3"/>
    <path d="M4 74q16 16 32 0" stroke-width="4"/>
    <path d="M92 46q16 16 32 0" stroke-width="4"/>
    <g>
      <circle cx="64" cy="38" r="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.8"/>
      <circle cx="64" cy="38" r="1.4" fill="#B45309" stroke="none"/>
      <g stroke="#B45309" stroke-width="2.4" stroke-linecap="round">
        <line x1="64" y1="34" x2="64" y2="32.4"/>
        <line x1="67.5" y1="36" x2="68.9" y2="35.2"/>
        <line x1="67.5" y1="40" x2="68.9" y2="40.8"/>
        <line x1="64" y1="42" x2="64" y2="43.6"/>
        <line x1="60.5" y1="40" x2="59.2" y2="40.8"/>
        <line x1="60.5" y1="36" x2="59.2" y2="35.2"/>
      </g>
    </g>
  </g>
</svg>
