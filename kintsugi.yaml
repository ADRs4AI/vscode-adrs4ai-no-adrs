# kintsugi.yaml — vscode-adrs-for-ai's manifest (fleet deployment tour, 2026-08-08).
# Drafted by Kintsugi 5 from the lumbroso-hq exemplar; artifacts limited to
# what this repo carries today. README.md deliberately untracked (repo's own
# front door — adding it is a later per-repo choice, made legibly).
# Zoned file: canonical policy above the sentinel; this repo's choices below.

kintsugi_schema: 1

canonical:
  name: human-ai-collaboration-template
  remote: https://github.com/jlumbroso/human-ai-collaboration-template-A

artifacts:
  CLAUDE.md:
    class: reconcile
  justfile:
    class: reconcile
  CHANGELOG.md:
    class: stencil
  docs/METHODOLOGY.md:
    class: stencil
  docs/adr/templates/adr.md:
    class: stencil
    marker: 'adr'
  docs/adr/templates/adr-madr.md:
    class: stencil
    marker: 'adr-madr'
  docs/adr/templates/seed.md:
    class: stencil
    marker: 'seed'
  docs/adr/templates/debrief.md:
    class: stencil
    marker: 'debrief'
  docs/adr/templates/failure-classes.md:
    class: stencil
    marker: 'failure-classes'
  docs/inbox/ONBOARDING.md:
    class: stencil
  docs/inbox/CONVENTIONS.md:
    class: stencil
  docs/inbox/ENCODING-MAP.md:
    class: stencil
  docs/inbox/INBOX-PROTOCOL.md:
    class: stencil

renames:                    # canonical facts (git log --diff-filter=R v3.8.0..v3.9.1)
  "3.9.0":
    docs/adr/templates/template.md: docs/adr/templates/adr-madr.md
    docs/adr/templates/collab-adr-lean.md: docs/adr/templates/adr.md
    docs/adr/templates/debrief-template.md: docs/adr/templates/debrief.md
    docs/adr/templates/seed-template.md: docs/adr/templates/seed.md

features:                   # labels only in v0
  crew-layer:
    - docs/inbox/ONBOARDING.md
    - docs/inbox/CONVENTIONS.md
    - docs/inbox/ENCODING-MAP.md
    - docs/inbox/INBOX-PROTOCOL.md

# ═══ kintsugi: local zone ═══ everything below is this repo's own; updates never touch it

journal:
  path: TEMPLATE-UPDATES.md
  enabled: true


