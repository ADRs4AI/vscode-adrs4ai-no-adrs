# The shipped product, dogfooding itself: this repo's code-public/record-gated
# posture (the founder's C verdict) via the Marketplace Action.
#
# POSTURE (the founder's switch, 2026-10-21): CONTINUOUS — the two-phase
# engine landed and was proven live (Action ADR-0001 It-7), so on-push
# incremental syncing is now the honest shape: each push fast-forwards the
# mirror, prior SHAs stay reachable, and only a declared history_epoch "new"
# ever rewrites. Rapid pushes: concurrency cancels the older run; state
# persists only AFTER a successful mirror push, so cancellation at any point
# is self-healing. The Action writes ONE thing to this repo: the state branch
# `no-adrs-mirror/state` — machinery, not record; leave it be.
#
# approved_paths = the reviewed union of every top-level path that EVER
# existed in history, minus strips (filter mode publishes history, so the
# consent gate checks all of it). Review receipt 2026-10-20: historical
# *.vsix build artifacts stripped (reproducible outputs, not record); all
# remaining tops approved. kintsugi.yaml + lock stay visible per the
# founder's 10-19 lean ("role models our tooling").
name: no-adrs-mirror
on:
  push: { branches: [main] }   # continuous restored at the founder's word (Action ADR-0001 QST-SPECIMEN-UNPAUSE: "OK, let's go with Option A") — It-8's crash closed by It-9's filter_repo_shim, proven on this pair (run 39689221832: incremental, no force, prior tip a parent)
  workflow_dispatch:

concurrency:
  group: no-adrs-mirror
  cancel-in-progress: true
permissions:
  contents: write   # filter mode persists its state branch back to THIS repo
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }        # filter mode needs full history
      - uses: ADRs4AI/no-adrs-mirror@v1
        with:
          token: ${{ secrets.MIRROR_TOKEN }}
          create_if_missing: "true"      # creates PRIVATE, always
          history_mode: filter
          message_mode: mechanical       # deterministic lines, no model, no leakage
          additional_strip_paths: |
            docs
            justfile
            TEMPLATE-UPDATES.md
            .vscode/terminals.json
            *.vsix
          approved_paths: |
            kintsugi.yaml
            kintsugi.lock
            .github
            .gitignore
            .vscode
            .vscode-test.mjs
            .vscodeignore
            CHANGELOG.md
            fixture-workspace
            LICENSE
            media
            package-lock.json
            package.json
            QUICK-START.md
            README.md
            scripts
            src
            tsconfig.integration.json
            tsconfig.json
            vite.config.ts
            vite.mcp-server.config.ts
          disable_workflows: |
            release.yml
