# The shipped product, dogfooding itself: this repo's code-public/record-gated
# posture (the founder's C verdict) via the Marketplace Action. Landed at his
# order 2026-10-20 ("recreate it using the marketplace setup"). The mirror is
# created PRIVATE; flipping it public is his act alone. kintsugi.yaml + lock
# stay visible per his 10-19 lean ("role models our tooling").
name: no-adrs-mirror
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }        # filter mode needs full history
      - uses: ADRs4AI/no-adrs-mirror@v1
        with:
          token: ${{ secrets.MIRROR_TOKEN }}
          create_if_missing: "true"      # creates PRIVATE, always
          history_mode: filter
          message_mode: mechanical       # deterministic lines, no model, no leakage
          additional_strip_paths: |
            justfile
            TEMPLATE-UPDATES.md
            .vscode/terminals.json
          disable_workflows: |
            release.yml
            no-adrs-mirror.yml
