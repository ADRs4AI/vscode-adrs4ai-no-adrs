name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a stale run for the same branch/PR when a newer push supersedes it
# (per epistemic-arc-mapping-skill's build-skill.yaml) — relevant here given
# how fast commits have been landing tonight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 20 is being retired as the GitHub Actions runtime; force JS-based
# actions onto Node 24 explicitly rather than waiting on each action's
# default (per epistemic-arc-mapping-skill's Node 24 migration, 2026-03).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        id: test
        run: |
          npm test -- --reporter=verbose 2>&1 | tee test-output.txt
          # grep -w "Tests" (not the raw '\d+ passed' pattern) — vitest's
          # verbose reporter prints "Test Files N passed" *before* "Tests N
          # passed", and the old pattern matched the file count, not the
          # test count (confirmed: reported "8" when the true total was 280).
          PASSED=$(grep -w "Tests" test-output.txt | grep -oP '\d+(?= passed)' | head -1)
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT

      - name: Write step summary
        run: |
          PASSED="${{ steps.test.outputs.passed }}"
          SHA="${{ github.sha }}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧪 CI — ADRs for AI

          | | Result |
          |-|--------|
          | Type check | ✅ Clean |
          | Tests | ✅ **${PASSED}** passing |
          | Commit | \`${SHA:0:7}\` |
          EOF

      # Coverage (Fixture 5, 2026-09-06): reuses the SAME src/parser/**,
      # src/index/** scope as `npm run test:coverage` (vite.config.ts's own
      # `test.coverage.include`) — deliberately not broadened here, to avoid
      # silently redefining what "coverage" means project-wide as a side
      # effect of a README badge. Only adds the `lcov` reporter (not in the
      # provider's default set) so Codecov has something to ingest.
      - name: Coverage
        run: npm run test:coverage -- --coverage.reporter=lcov --coverage.reporter=text-summary

      # continue-on-error + fail_ci_if_error:false: this repo is private as
      # of 2026-09, so Codecov's tokenless upload (public-repo only) will
      # fail here until CODECOV_TOKEN is added as a secret, or until the repo
      # goes public (at which point this starts working with zero changes).
      # Never allowed to fail the required test job either way.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
