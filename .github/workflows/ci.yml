name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        id: test
        run: |
          npm test -- --reporter=verbose 2>&1 | tee test-output.txt
          PASSED=$(grep -oP '\d+ passed' test-output.txt | grep -oP '\d+' | head -1)
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT

      - name: Write step summary
        run: |
          PASSED="${{ steps.test.outputs.passed }}"
          SHA="${{ github.sha }}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧪 CI — ADRs for AI

          | | Result |
          |-|--------|
          | Type check | ✅ Clean |
          | Tests | ✅ **${PASSED}** passing |
          | Commit | \`${SHA:0:7}\` |
          EOF
