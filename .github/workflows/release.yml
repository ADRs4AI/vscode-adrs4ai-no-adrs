name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Node 20 is being retired as the GitHub Actions runtime; force JS-based
# actions onto Node 24 explicitly rather than waiting on each action's
# default (per epistemic-arc-mapping-skill's Node 24 migration, 2026-03).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so generate_release_notes can diff

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        id: test
        run: |
          npm test -- --reporter=verbose 2>&1 | tee test-output.txt
          # grep -w "Tests" (not the raw '\d+ passed'/'\d+ failed' pattern) —
          # vitest's verbose reporter prints "Test Files N passed" *before*
          # "Tests N passed", and the old pattern matched the file count, not
          # the test count (confirmed on v0.5.2's own release: reported "8"
          # when the true total was 280).
          PASSED=$(grep -w "Tests" test-output.txt | grep -oP '\d+(?= passed)' | head -1)
          FAILED=$(grep -w "Tests" test-output.txt | grep -oP '\d+(?= failed)' | head -1)
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build

      - name: Package extension
        id: package
        run: |
          npm run package
          VSIX=$(ls *.vsix | head -1)
          SIZE=$(du -sh "$VSIX" | cut -f1)
          echo "vsix=$VSIX" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Write step summary
        run: |
          VERSION="${{ github.ref_name }}"
          VSIX="${{ steps.package.outputs.vsix }}"
          SIZE="${{ steps.package.outputs.size }}"
          PASSED="${{ steps.test.outputs.passed }}"
          FAILED="${{ steps.test.outputs.failed }}"
          TEST_ICON=$([ "$FAILED" = "0" ] && echo "✅" || echo "❌")
          REPO="${{ github.repository }}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 ADRs for AI — ${VERSION}

          > Navigate and manage Architectural Decision Records for human-AI collaboration.

          ## Build Pipeline

          | Step | Result |
          |------|--------|
          | 🔍 Type check | ✅ Clean |
          | 🧪 Tests | ${TEST_ICON} **${PASSED}** passing, **${FAILED}** failed |
          | 📦 Build | ✅ Bundled |
          | 🎁 Package | ✅ \`${VSIX}\` (${SIZE}) |

          ## Install

          Download **\`${VSIX}\`** from the assets below, then:

          \`\`\`bash
          code --install-extension ${VSIX}
          \`\`\`

          Or install directly from the [releases page](https://github.com/${REPO}/releases/tag/${VERSION}).
          EOF

      - name: Extract CHANGELOG entry
        # Jérémie's actual ask (2026-07-23-0105 correction, ADR-0033
        # withdrawal note): "it's just in GitHub, in the release message."
        # Every release before this pointed at the same hardcoded generic
        # description ("Navigate and manage Architectural Decision
        # Records..."), verbatim, on all 27+ releases — this pulls the
        # authored `## [X.Y.Z]` section from CHANGELOG.md instead. Hard
        # failure (not a silent fallback to the generic text) if a tag
        # lands with no matching entry: `just release` already refuses to
        # ship without one locally, so reaching CI without one means that
        # guard was bypassed, and this is the last place left to catch it.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Escape dots for awk's dynamic-regex context — "ver" is spliced
          # into a regex string, where an unescaped "." matches ANY
          # character, not a literal dot (harmless today, since no two
          # version headings could plausibly collide, but this project
          # doesn't ship "harmless today" imprecision when it's free to fix).
          # Double backslash, not single: awk's -v assignment runs its own
          # escape-sequence processing on the value BEFORE the regex engine
          # ever sees it, so a single "\." would have its backslash
          # stripped and silently revert to the wildcard-dot bug.
          VERSION_RE=$(echo "$VERSION" | sed 's/\./\\\\./g')
          awk -v ver="$VERSION_RE" '
            $0 ~ "^## \\[" ver "\\] -" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changelog-entry.md
          if [ ! -s changelog-entry.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION (expected a '## [$VERSION] - YYYY-MM-DD' heading)"
            exit 1
          fi
          cat changelog-entry.md

      - name: Build release notes
        run: |
          VSIX="${{ steps.package.outputs.vsix }}"
          {
            echo "## ADRs for AI ${{ github.ref_name }}"
            echo
            cat changelog-entry.md
            echo
            echo "### Install"
            echo
            echo "Download \`${VSIX}\` from the assets below and run:"
            echo
            echo '```bash'
            echo "code --install-extension ${VSIX}"
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.vsix }}
          generate_release_notes: true
          body_path: release-notes.md
