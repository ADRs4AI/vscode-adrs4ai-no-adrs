# Tmux seat configuration — invisibility config for VS Code integrated terminal
#
# Ported from caring-form (ADR-0050 lineage; Steward 4.5, Commodore 5, Jérémie
# — see scripts/last-message.py's wake-infrastructure header comment for full
# attribution). See ADRs4AI meta repo ADR-0004/ADR-0005.
#
# Goal: Inside a plain VS Code terminal, a launched seat should be visually and
# behaviorally indistinguishable from bare `claude` at first approximation —
# with one deliberate exception (below).
#
# Usage: `tmux new-session -f scripts/tmux/seat.conf -s <project>-<alias>-seat claude --resume <uuid> --model <model>`
#
# This config is loaded via `-f`, so it never touches ~/.tmux.conf.

# Status bar: ON, with a per-seat color (set by the launcher from
# agent-sessions.json's optional settings.color_hex, decoupled from the
# CLI /color palette). Philosophy shift from the original "no green bar"
# spec, per the improvements-batch discovery: tmux supports arbitrary hex
# colors, which Claude Code's own ~8-color /color palette does not — so the
# status bar goes from a thing to hide into the seat's visual identifier.
# Default gray below is overridden per-session if a seat has a color_hex set.
set -g status on
set -g status-style "bg=#666666,fg=white"

# Status bar content: custom format so Claude Code's own pane-title
# animation emoji (added during turns) never reaches the display. The
# launcher overrides status-right per-session with the literal display
# name (see cmd_launch/_tmux_set_status_right) — the fallback below only
# matters for a session status-right hasn't been set on yet.
set -g status-left-length 50
set -g status-left "[#S] "
set -g status-right-length 50
set -g status-right "#{?@seat_display_name,#{@seat_display_name},#{pane_title}} | %H:%M %d-%b-%y"

# Terminal title: on (set by launcher with seat display name)
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Mouse: on (wheel scroll → copy-mode scrollback that feels native)
set -g mouse on

# History: large scrollback buffer
set -g history-limit 50000

# Truecolor support (for Claude Code's UI)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Detached default size (headless new-session fails under systemd without explicit size)
set -g default-size 80x24

# Prefix key: LEFT ALONE (default Ctrl-B)
# NOTE: If Claude Code TUI needs Ctrl-B passthrough, rebind prefix here to
# something obscure (e.g., Ctrl-\). Verify first that Ctrl-B isn't needed by
# the TUI before changing this. For now: keeping default, assuming no conflict.

# Window/pane settings: quiet, minimal
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Escape time: reduce delay for key sequences (helps with responsiveness)
set -sg escape-time 10

# Base index: start windows and panes at 1 (not 0) for easier keyboard nav
set -g base-index 1
setw -g pane-base-index 1

# Automatic window renaming: off (prevents tmux from overwriting custom names)
setw -g automatic-rename off
set -g allow-rename off
